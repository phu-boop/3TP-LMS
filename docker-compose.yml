version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms_dev
      POSTGRES_PASSWORD: lms_dev
      POSTGRES_DB: lms_dev
    ports:
      - "5433:5432"
    volumes:
      - lms-postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_dev -d lms_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: lms-redis-local
    restart: unless-stopped
    command: >
      sh -c 'exec redis-server
      --appendonly yes
      --save 60 1000
      --requirepass "lms_dev_redis"'
    ports:
      - "6380:6379"
    volumes:
      - lms-redis-local-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"lms_dev_redis\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lms-minio-local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "lms-api-sa"
      MINIO_ROOT_PASSWORD: "GCMAJ2ejDFU20QNZbOupjLpI0bp5hetsUoYhY3Qy"
      MINIO_SERVER_URL: "http://localhost:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lms-minio-local-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  minio-setup:
    image: minio/mc
    container_name: lms-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 lms-api-sa GCMAJ2ejDFU20QNZbOupjLpI0bp5hetsUoYhY3Qy;
      mc mb myminio/lms-content --ignore-existing;
      mc mb myminio/lms-hls --ignore-existing;
      mc mb myminio/lms-thumb --ignore-existing;
      mc anonymous set public myminio/lms-hls;
      mc anonymous set public myminio/lms-thumb;
      echo 'MinIO buckets created successfully';
      exit 0;
      "

volumes:
  lms-postgres-local-data:
  lms-redis-local-data:
  lms-minio-local-data:
